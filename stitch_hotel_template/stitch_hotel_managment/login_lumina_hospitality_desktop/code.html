<style>
    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.08), inset 1px 1px 0 rgba(255, 255, 255, 0.3);
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .input-focus-teal:focus-within label {
      color: #006683;
      transform: translateY(-1.5rem) scale(0.85);
    }
    .transition-custom {
      transition: all 0.3s ease-out;
    }
    .floating-label-container label {
      pointer-events: none;
      transition: all 0.3s ease-out;
    }
    .floating-label-container input:focus + label,
    .floating-label-container input:not(:placeholder-shown) + label {
      transform: translateY(-1.25rem) scale(0.85);
      color: #006683;
      font-weight: 700;
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body-md overflow-hidden h-screen w-screen m-0 p-0 flex">
<!-- Left Side: Hero Image (Split Screen) -->
<aside class="hidden lg:block w-7/12 relative h-full overflow-hidden">
<img alt="Luxury Hotel" class="absolute inset-0 w-full h-full object-cover" data-alt="A wide-angle, cinematic view of a luxury boutique hotel lobby at dusk. The space features soaring ceilings, marble floors, and floor-to-ceiling glass windows overlooking a serene infinity pool. Warm, golden architectural lighting highlights rich wood textures and plush velvet furniture. The overall mood is sophisticated, calm, and exquisitely professional, reflecting a high-end hospitality environment with a palette of deep teals and warm ambers." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAXso4HSdi3BOfCqgOe2gA0-nXGQH6Fh_ky5oFYYyIP2eHyTEtXe6LGBoySEGorFschfZKPKpICN6l3V7FA-DPKtnRTj9ncE3Bi7a0X0o3_9dh5JU7pXr2lOvMi7TeuaK_Efp9P2GK7Xrt2BMOtHZoFhLzD5tSGOXnplNli88UEXNAsAoow0VOow4XNKoZ7_ys-YuZ-xKijPaqOYFOQOF5m7QKC4_F_pygKhdORk_Rte-L29GaHd8p_6E2AWicuI_5j1gev6Om7A_A"/>
<!-- Overlay Gradient for Brand Presence -->
<div class="absolute inset-0 bg-gradient-to-tr from-primary/40 to-transparent flex flex-col justify-end p-xl">
<div class="max-w-xl">
<h1 class="font-h1 text-h1 text-white drop-shadow-lg mb-sm">Refining Excellence.</h1>
<p class="font-body-lg text-white/90 drop-shadow-md">The management suite for the world's most distinguished properties.</p>
</div>
</div>
</aside>
<!-- Right Side: Login Section -->
<main class="w-full lg:w-5/12 h-full flex flex-col items-center justify-center relative bg-surface p-gutter overflow-y-auto">
<!-- Subtle Background Shader (Simulated with simple CSS pattern to avoid bloat) -->
<div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#006683 1px, transparent 1px); background-size: 40px 40px;"></div>
<!-- Top Branding Anchor -->
<header class="absolute top-md left-gutter lg:left-xl z-10">
<div class="font-h2 text-h2 tracking-tight text-primary flex items-center gap-xs">
<span class="material-symbols-outlined text-[32px]">lightbulb_circle</span>
<span>Lumina</span>
</div>
</header>
<!-- Centered Glass-morphism Login Card -->
<div class="glass-card w-full max-w-md rounded-xl p-xl z-20 transition-custom hover:shadow-lg">
<div class="mb-xl">
<h2 class="font-h3 text-h3 text-on-surface mb-xs">Welcome Back</h2>
<p class="font-body-sm text-on-surface-variant">Please enter your credentials to access the console.</p>
</div>
<form class="space-y-lg" onsubmit="event.preventDefault();">
<!-- Username Input -->
<div class="relative floating-label-container pt-sm border-b-2 border-outline-variant focus-within:border-primary transition-custom">
<input class="block w-full border-none bg-transparent py-sm px-0 focus:ring-0 font-body-md text-on-surface transition-custom" id="username" placeholder=" " type="text"/>
<label class="absolute left-0 top-sm font-body-md text-on-surface-variant origin-[0]" for="username">Staff Identifier</label>
</div>
<!-- Password Input -->
<div class="relative floating-label-container pt-sm border-b-2 border-outline-variant focus-within:border-primary transition-custom">
<input class="block w-full border-none bg-transparent py-sm px-0 focus:ring-0 font-body-md text-on-surface transition-custom" id="password" placeholder=" " type="password"/>
<label class="absolute left-0 top-sm font-body-md text-on-surface-variant origin-[0]" for="password">Security Key</label>
<button class="absolute right-0 top-sm text-outline hover:text-primary transition-custom" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<div class="flex items-center justify-between py-xs">
<label class="flex items-center gap-xs cursor-pointer group">
<input class="w-4 h-4 rounded border-outline text-primary focus:ring-primary/20" type="checkbox"/>
<span class="font-label-md text-on-surface-variant group-hover:text-on-surface transition-custom">Keep me signed in</span>
</label>
<a class="font-label-md text-primary hover:opacity-80 transition-custom underline decoration-primary/30 underline-offset-4" href="#">Forgot access?</a>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary py-md px-lg rounded-lg font-button text-button shadow-md hover:brightness-90 active:scale-95 transition-custom flex justify-center items-center gap-sm group" type="submit">
<span>Authorize Access</span>
<span class="material-symbols-outlined text-[18px] transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</form>
<!-- Footer Help -->
<footer class="mt-xl flex flex-col items-center gap-md">
<div class="h-px w-16 bg-outline-variant"></div>
<p class="font-label-md text-on-surface-variant text-center opacity-70">
          SECURE CHANNEL ENCRYPTED<br/>
<span class="text-[10px] tracking-widest uppercase">Property Intelligence Suite v4.2</span>
</p>
</footer>
</div>
<!-- Minimalist Footer Links -->
<nav class="absolute bottom-md flex gap-lg opacity-40 hover:opacity-100 transition-custom">
<a class="font-label-md hover:text-primary" href="#">System Status</a>
<a class="font-label-md hover:text-primary" href="#">Global Support</a>
<a class="font-label-md hover:text-primary" href="#">Privacy</a>
</nav>
</main>
<!-- Interactive script for micro-interactions -->
<script>
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('focus', () => {
        input.parentElement.classList.add('border-primary');
        input.parentElement.classList.remove('border-outline-variant');
      });
      input.addEventListener('blur', () => {
        if (!input.value) {
          input.parentElement.classList.remove('border-primary');
          input.parentElement.classList.add('border-outline-variant');
        }
      });
    });

    // Simple interaction for the visibility toggle
    const togglePass = document.querySelector('button[type="button"]');
    const passInput = document.getElementById('password');
    togglePass.addEventListener('click', () => {
      const isPass = passInput.type === 'password';
      passInput.type = isPass ? 'text' : 'password';
      togglePass.querySelector('span').innerText = isPass ? 'visibility_off' : 'visibility';
    });
  </script>
</body></html>
