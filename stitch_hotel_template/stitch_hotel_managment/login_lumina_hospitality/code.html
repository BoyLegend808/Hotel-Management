<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.08), inset 1px 1px 0 rgba(255, 255, 255, 0.4);
        }

        .floating-label-group {
            position: relative;
        }

        .floating-label-group input:focus ~ label,
        .floating-label-group input:not(:placeholder-shown) ~ label {
            transform: translateY(-1.25rem) scale(0.85);
            color: #006683; /* primary color */
            font-weight: 700;
        }

        .floating-label-group label {
            position: absolute;
            top: 0.75rem;
            left: 0;
            transition: all 0.3s ease-out;
            pointer-events: none;
        }

        .floating-label-group input {
            border: none;
            border-bottom: 2px solid #bfc8cd; /* outline-variant */
            background: transparent !important;
            box-shadow: none !important;
        }

        .floating-label-group input:focus {
            border-bottom-color: #006683; /* primary color */
            outline: none;
        }

        .bg-animate {
            background-size: cover;
            background-position: center;
            filter: brightness(0.85) blur(4px);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            transform: scale(1.05);
        }

        .transition-03 {
            transition: all 0.3s ease-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex items-center justify-center p-md">
<!-- Hospitality Background -->
<div class="bg-animate" data-alt="A luxurious high-end hotel lobby with grand marble floors and soft golden ambient lighting filtering through floor-to-ceiling windows. The scene captures the sophisticated essence of luxury hospitality with polished surfaces and minimalist designer furniture. The color palette features deep teals, warm golds, and pristine whites, creating a serene and professional atmosphere that reflects modern elegance and high-level service.">
<img alt="Luxury Hotel" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCnFU29ya4sALzD1LTxLTOIus6k5u6pqrURhImINHmcjyAk6RPsKkHgb_C-1q9cVlsHN1pJVyG4PWvsCxJt9XfT7SPOBQ6W-DPxnyy6Q1SyB3-XIbAj94M_zrVRoLKWPuNjOezXEBLETzI4OBeJD3x9d4ZqPR3NmBd2uzm3bm_5bp0IXZpC-T0N1qZao1UsMcA8gXWIo0BTVvxxcgWKcYtqNHRS1T6aiWx8s9WGE1HTKuEvePkIoBBG1-Jd6PqEuo9IyYkrhwPBNPE"/>
</div>
<!-- Login Container -->
<main class="w-full max-w-md relative z-10">
<!-- Header / Logo -->
<div class="text-center mb-xl">
<h1 class="font-h1 text-h1 text-white drop-shadow-lg tracking-tight mb-xs">
                Lumina Hospitality
            </h1>
<p class="font-body-md text-white/90 drop-shadow-md">
                Managing Excellence in Service
            </p>
</div>
<!-- Glass Card -->
<div class="glass-card rounded-xl p-xl flex flex-col gap-lg">
<header class="mb-sm">
<h2 class="font-h2 text-h2 text-primary">Login</h2>
<p class="font-body-sm text-on-surface-variant">Access your management console</p>
</header>
<form class="flex flex-col gap-xl" onsubmit="return false;">
<!-- Email Field -->
<div class="floating-label-group">
<input class="w-full py-sm px-0 font-body-md text-on-surface" id="email" placeholder=" " required="" type="email"/>
<label class="font-body-md text-on-surface-variant" for="email">Email Address</label>
</div>
<!-- Password Field -->
<div class="floating-label-group">
<input class="w-full py-sm px-0 font-body-md text-on-surface" id="password" placeholder=" " required="" type="password"/>
<label class="font-body-md text-on-surface-variant" for="password">Password</label>
<div class="absolute right-0 top-2 cursor-pointer text-on-surface-variant hover:text-primary transition-03">
<span class="material-symbols-outlined">visibility</span>
</div>
</div>
<div class="flex justify-end">
<a class="font-label-md text-primary hover:opacity-80 transition-03" href="#">
                        Forgot password?
                    </a>
</div>
<!-- Primary Action -->
<button class="bg-primary text-white font-button text-button py-md rounded-lg shadow-sm hover:brightness-90 active:scale-[0.98] transition-03 flex items-center justify-center gap-sm" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<div class="relative py-md">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-xs">
<span class="bg-transparent px-md text-on-surface-variant font-label-md bg-white/20">OR</span>
</div>
</div>
<div class="text-center">
<p class="font-body-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline transition-03" href="#">Create account</a>
</p>
</div>
</div>
<!-- Footer Links -->
<footer class="mt-lg flex justify-center gap-lg text-white/70 font-label-md">
<a class="hover:text-white transition-03" href="#">Privacy Policy</a>
<span>•</span>
<a class="hover:text-white transition-03" href="#">Terms of Service</a>
<span>•</span>
<a class="hover:text-white transition-03" href="#">Support</a>
</footer>
</main>
<script>
        // Micro-interaction for password visibility
        const visibilityBtn = document.querySelector('.material-symbols-outlined');
        const passwordInput = document.getElementById('password');
        
        if (visibilityBtn && passwordInput) {
            visibilityBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                visibilityBtn.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });
        }

        // Simple button active state handling for touch
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.style.transform = 'scale(0.96)';
            });
            btn.addEventListener('touchend', () => {
                btn.style.transform = 'scale(1)';
            });
        });
    </script>
</body></html>
