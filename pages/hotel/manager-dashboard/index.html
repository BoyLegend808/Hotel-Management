<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard | Lumina Hospitality</title>
    <link href="/css/lumina-design-system.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1A3636',
                        secondary: '#D4AF37',
                        surface: '#F8F9FA'
                    }
                }
            }
        };
    </script>
    <script src="manager.js" defer></script>
</head>
<body class="bg-surface text-primary min-h-screen font-['Inter'] flex flex-col">
    <!-- Navbar -->
    <nav class="bg-primary text-white p-4 shadow-md flex justify-between items-center">
        <div class="text-2xl font-['Playfair_Display'] font-semibold">Lumina Manager Portal</div>
        <div class="flex items-center gap-4">
            <span id="userNameDisplay" class="font-medium">Manager</span>
            <button id="logoutBtn" class="px-4 py-2 bg-secondary text-primary font-medium rounded hover:bg-opacity-90 transition-colors">Sign Out</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow p-8 max-w-7xl mx-auto w-full space-y-8">
        
        <header class="flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-['Playfair_Display'] mb-2">Financial Overview</h1>
                <p class="text-gray-600">High-level analytics and recent activity.</p>
            </div>
            <button class="bg-surface border border-primary text-primary px-4 py-2 rounded shadow-sm hover:bg-primary/5 flex items-center gap-2">
                <span class="material-symbols-outlined">download</span> Download Report
            </button>
        </header>

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-medium mb-1">Total Revenue</p>
                    <h2 class="text-3xl font-['Playfair_Display'] text-green-700" id="statRevenue">$0.00</h2>
                </div>
                <div class="w-12 h-12 rounded-full bg-green-50 flex items-center justify-center text-green-600">
                    <span class="material-symbols-outlined">payments</span>
                </div>
            </div>
            
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-medium mb-1">Occupancy Rate</p>
                    <h2 class="text-3xl font-['Playfair_Display'] text-blue-700" id="statOccupancy">0%</h2>
                    <p class="text-xs text-gray-400 mt-1" id="statOccupancyDetails">0 of 0 Rooms</p>
                </div>
                <div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center text-blue-600">
                    <span class="material-symbols-outlined">hotel</span>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-medium mb-1">Total Bookings</p>
                    <h2 class="text-3xl font-['Playfair_Display'] text-purple-700" id="statTotalBookings">0</h2>
                </div>
                <div class="w-12 h-12 rounded-full bg-purple-50 flex items-center justify-center text-purple-600">
                    <span class="material-symbols-outlined">book_online</span>
                </div>
            </div>
        </div>

        <!-- Recent Bookings Table -->
        <section class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-xl font-['Playfair_Display']">Recent Bookings</h3>
                <a href="/pages/hotel/reception/reception.html" class="text-sm text-blue-600 hover:underline">View Reception Dashboard</a>
            </div>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-200 text-sm">
                        <th class="p-4 font-semibold text-gray-600">Guest</th>
                        <th class="p-4 font-semibold text-gray-600">Room</th>
                        <th class="p-4 font-semibold text-gray-600">Status</th>
                        <th class="p-4 font-semibold text-gray-600">Total</th>
                        <th class="p-4 font-semibold text-gray-600">Date Created</th>
                    </tr>
                </thead>
                <tbody id="recentBookingsBody">
                    <tr><td colspan="5" class="p-8 text-center text-gray-500">Loading analytics...</td></tr>
                </tbody>
            </table>
        </section>

    </main>
</body>
</html>
