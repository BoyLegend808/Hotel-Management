<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptionist Dashboard | Lumina Hospitality</title>
    <link href="/css/lumina-design-system.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="reception.js" defer></script>
</head>
<body class="bg-surface text-primary min-h-screen font-['Inter'] flex flex-col">
    <!-- Navbar -->
    <nav class="bg-primary text-white p-4 shadow-md flex justify-between items-center">
        <div class="text-2xl font-['Playfair_Display'] font-semibold">Lumina Front Desk</div>
        <div class="flex items-center gap-4">
            <span id="userNameDisplay" class="font-medium">Receptionist</span>
            <button id="logoutBtn" class="px-4 py-2 bg-secondary text-primary font-medium rounded hover:bg-opacity-90 transition-colors">Sign Out</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow p-8 max-w-7xl mx-auto w-full">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-['Playfair_Display']">Today's Check-ins & Check-outs</h1>
            <div class="flex gap-4">
                <button id="openSettingsBtn" class="bg-surface border border-primary text-primary px-4 py-2 rounded shadow-sm hover:bg-primary/5 flex items-center gap-2">
                    <span class="material-symbols-outlined">settings</span> Bank Settings
                </button>
                <button id="openWalkInBtn" class="bg-primary text-white px-4 py-2 rounded shadow-md hover:bg-opacity-90 flex items-center gap-2">
                    <span class="material-symbols-outlined">add</span> New Walk-In Booking
                </button>
            </div>
        </div>
        
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-200">
                        <th class="p-4 font-semibold">Guest</th>
                        <th class="p-4 font-semibold">Contact & Code</th>
                        <th class="p-4 font-semibold">Room</th>
                        <th class="p-4 font-semibold">Dates</th>
                        <th class="p-4 font-semibold">Status</th>
                        <th class="p-4 font-semibold">Actions</th>
                    </tr>
                </thead>
                <tbody id="bookingsTableBody">
                    <tr><td colspan="5" class="p-8 text-center text-gray-500">Loading bookings...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Walk-In Booking Modal -->
    <div id="walkInModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-40 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-surface rounded-xl shadow-2xl p-8 max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-['Playfair_Display']">New Walk-In Booking</h2>
                <button id="closeWalkInBtn" class="text-gray-500 hover:text-primary transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            
            <form id="walkInForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Guest Name</label>
                        <input type="text" id="wiName" required class="w-full border border-gray-300 rounded p-2 focus:ring-1 focus:ring-primary focus:border-primary">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Guest Email</label>
                        <input type="email" id="wiEmail" required class="w-full border border-gray-300 rounded p-2 focus:ring-1 focus:ring-primary focus:border-primary">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Guest Phone</label>
                        <input type="tel" id="wiPhone" required class="w-full border border-gray-300 rounded p-2 focus:ring-1 focus:ring-primary focus:border-primary">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Room</label>
                        <select id="wiRoomId" required class="w-full border border-gray-300 rounded p-2 focus:ring-1 focus:ring-primary focus:border-primary">
                            <option value="1">The Heritage Suite</option>
                            <option value="2">Azure Pool Villa</option>
                            <option value="3">The Industrial Loft</option>
                            <option value="4">Peak View Cabin</option>
                            <option value="5">Oceanfront Penthouse</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Check In Date</label>
                        <input type="date" id="wiCheckIn" required class="w-full border border-gray-300 rounded p-2 focus:ring-1 focus:ring-primary focus:border-primary">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Check Out Date</label>
                        <input type="date" id="wiCheckOut" required class="w-full border border-gray-300 rounded p-2 focus:ring-1 focus:ring-primary focus:border-primary">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Number of Guests</label>
                        <input type="number" id="wiGuests" min="1" max="6" value="2" required class="w-full border border-gray-300 rounded p-2 focus:ring-1 focus:ring-primary focus:border-primary">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Payment Method</label>
                        <select id="wiPayment" class="w-full border border-gray-300 rounded p-2 focus:ring-1 focus:ring-primary focus:border-primary">
                            <option value="Cash">Cash</option>
                            <option value="Card (POS)">Card (POS)</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                        </select>
                    </div>
                </div>
                
                <div class="flex justify-end gap-4 mt-8 pt-4 border-t border-gray-200">
                    <button type="button" id="cancelWalkInBtn" class="px-4 py-2 border border-gray-300 text-gray-700 rounded hover:bg-gray-50">Cancel</button>
                    <button type="submit" id="submitWalkInBtn" class="px-6 py-2 bg-primary text-white rounded shadow hover:bg-opacity-90 flex items-center gap-2">
                        <span>Confirm Walk-In</span>
                        <div class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin" id="walkInLoader"></div>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Bank Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-surface rounded-xl shadow-2xl p-8 max-w-md w-full mx-4">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-['Playfair_Display']">Bank Settings</h2>
                <button id="closeSettingsBtn" class="text-gray-500 hover:text-primary transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            
            <form id="settingsForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Bank Name</label>
                    <input type="text" id="setBankName" required class="w-full border border-gray-300 rounded p-2 focus:ring-1 focus:ring-primary focus:border-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Account Number</label>
                    <input type="text" id="setAccountNumber" required class="w-full border border-gray-300 rounded p-2 focus:ring-1 focus:ring-primary focus:border-primary">
                </div>
                
                <div class="flex justify-end gap-4 mt-8 pt-4 border-t border-gray-200">
                    <button type="button" id="cancelSettingsBtn" class="px-4 py-2 border border-gray-300 text-gray-700 rounded hover:bg-gray-50">Cancel</button>
                    <button type="submit" id="submitSettingsBtn" class="px-6 py-2 bg-primary text-white rounded shadow hover:bg-opacity-90 flex items-center gap-2">
                        <span>Save Settings</span>
                        <div class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin" id="settingsLoader"></div>
                    </button>
                </div>
            </form>
        </div>
    </div>
    <!-- Edit Booking Modal -->
    <div id="editModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-surface rounded-xl shadow-2xl p-8 max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-['Playfair_Display']">Edit Booking</h2>
                <button id="closeEditBtn" class="text-gray-500 hover:text-primary transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            
            <form id="editForm" class="space-y-6">
                <input type="hidden" id="editBookingId">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Guest Name</label>
                        <input type="text" id="editName" required class="w-full border border-gray-300 rounded p-2 focus:ring-1 focus:ring-primary focus:border-primary">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Guest Email</label>
                        <input type="email" id="editEmail" required class="w-full border border-gray-300 rounded p-2 focus:ring-1 focus:ring-primary focus:border-primary">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Guest Phone</label>
                        <input type="tel" id="editPhone" required class="w-full border border-gray-300 rounded p-2 focus:ring-1 focus:ring-primary focus:border-primary">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Room Assignment</label>
                        <select id="editRoomId" required class="w-full border border-gray-300 rounded p-2 focus:ring-1 focus:ring-primary focus:border-primary">
                            <option value="1">The Heritage Suite (1)</option>
                            <option value="2">Azure Pool Villa (2)</option>
                            <option value="3">The Industrial Loft (3)</option>
                            <option value="4">Peak View Cabin (4)</option>
                            <option value="5">Oceanfront Penthouse (5)</option>
                        </select>
                        <p class="text-xs text-gray-500 mt-1">Changing the room will recalculate the bill.</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Check In Date</label>
                        <input type="date" id="editCheckIn" required class="w-full border border-gray-300 rounded p-2 focus:ring-1 focus:ring-primary focus:border-primary">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Check Out Date</label>
                        <input type="date" id="editCheckOut" required class="w-full border border-gray-300 rounded p-2 focus:ring-1 focus:ring-primary focus:border-primary">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Special Requests / Notes</label>
                        <textarea id="editRequests" rows="3" class="w-full border border-gray-300 rounded p-2 focus:ring-1 focus:ring-primary focus:border-primary"></textarea>
                    </div>
                </div>
                
                <div class="flex justify-end gap-4 mt-8 pt-4 border-t border-gray-200">
                    <button type="button" id="cancelEditBtn" class="px-4 py-2 border border-gray-300 text-gray-700 rounded hover:bg-gray-50">Cancel</button>
                    <button type="submit" id="submitEditBtn" class="px-6 py-2 bg-primary text-white rounded shadow hover:bg-opacity-90 flex items-center gap-2">
                        <span>Save Changes</span>
                        <div class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin" id="editLoader"></div>
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
