<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptionist Dashboard | Lumina Hospitality</title>
    <link href="/css/lumina-design-system.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1A3636',
                        secondary: '#D4AF37',
                        surface: '#F8F9FA'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-primary min-h-screen font-['Inter'] flex flex-col">
    <!-- Navbar -->
    <nav class="bg-primary text-white p-4 shadow-md flex justify-between items-center">
        <div class="text-2xl font-['Playfair_Display'] font-semibold">Lumina Front Desk</div>
        <div class="flex items-center gap-4">
            <span id="userNameDisplay" class="font-medium">Receptionist</span>
            <button onclick="logout()" class="px-4 py-2 bg-secondary text-primary font-medium rounded hover:bg-opacity-90 transition-colors">Sign Out</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow p-8 max-w-7xl mx-auto w-full">
        <h1 class="text-3xl font-['Playfair_Display'] mb-8">Today's Check-ins & Check-outs</h1>
        
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-200">
                        <th class="p-4 font-semibold">Guest</th>
                        <th class="p-4 font-semibold">Room</th>
                        <th class="p-4 font-semibold">Dates</th>
                        <th class="p-4 font-semibold">Status</th>
                        <th class="p-4 font-semibold">Actions</th>
                    </tr>
                </thead>
                <tbody id="bookingsTableBody">
                    <tr><td colspan="5" class="p-8 text-center text-gray-500">Loading bookings...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <script>
        // Auth check
        const token = sessionStorage.getItem('token');
        if (!token) window.location.href = '/pages/hotel/login-lumina/';

        function _toast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-4 rounded shadow-lg text-white font-medium transition-all transform translate-y-full opacity-0 ${type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600'}`;
            toast.textContent = message;
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-full', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('translate-y-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function logout() {
            sessionStorage.clear();
            window.location.href = '/pages/hotel/login-lumina/';
        }

        async function loadBookings() {
            try {
                const res = await fetch('/api/bookings', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (data.success) {
                    const tbody = document.getElementById('bookingsTableBody');
                    if (data.bookings.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-gray-500">No bookings found.</td></tr>';
                        return;
                    }

                    // Sort so pending/confirmed are at top
                    data.bookings.sort((a,b) => new Date(a.checkInDate) - new Date(b.checkInDate));

                    tbody.innerHTML = data.bookings.map(b => `
                        <tr class="border-b border-gray-100 hover:bg-gray-50">
                            <td class="p-4">
                                <div class="font-medium">${b.guestName}</div>
                                <div class="text-sm text-gray-500">${b.guests} Guests</div>
                            </td>
                            <td class="p-4">Room ${b.roomId}</td>
                            <td class="p-4">
                                <div class="text-sm">${b.checkInDate} to</div>
                                <div class="text-sm">${b.checkOutDate}</div>
                            </td>
                            <td class="p-4">
                                <span class="px-2 py-1 rounded text-xs font-medium ${
                                    b.status === 'Confirmed' ? 'bg-blue-100 text-blue-800' :
                                    b.status === 'CheckedIn' ? 'bg-green-100 text-green-800' :
                                    b.status === 'CheckedOut' ? 'bg-gray-100 text-gray-800' :
                                    'bg-red-100 text-red-800'
                                }">${b.status}</span>
                            </td>
                            <td class="p-4">
                                ${b.status === 'Confirmed' ? `<button onclick="updateStatus(${b.id}, 'CheckedIn')" class="px-3 py-1 bg-green-600 text-white rounded text-sm hover:bg-green-700">Check In</button>` : ''}
                                ${b.status === 'CheckedIn' ? `<button onclick="updateStatus(${b.id}, 'CheckedOut')" class="px-3 py-1 bg-primary text-white rounded text-sm hover:bg-opacity-90">Check Out</button>` : ''}
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (err) {
                console.error(err);
                _toast('Failed to load bookings', 'error');
            }
        }

        async function updateStatus(id, status) {
            const csrf = sessionStorage.getItem('csrfToken');
            try {
                const res = await fetch(`/api/bookings/${id}/status`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'X-CSRF-Token': csrf
                    },
                    body: JSON.stringify({ status })
                });
                
                const data = await res.json();
                if (data.success) {
                    _toast(`Successfully updated to ${status}`, 'success');
                    loadBookings();
                } else {
                    _toast(data.message || 'Update failed', 'error');
                }
            } catch(e) {
                _toast('Network error', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(sessionStorage.getItem('user') || '{}');
            if (user.name) document.getElementById('userNameDisplay').textContent = user.name;
            loadBookings();
        });
    </script>
</body>
</html>
