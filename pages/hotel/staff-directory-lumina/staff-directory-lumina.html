    <div class="flex h-screen overflow-hidden">
        <!-- NavigationDrawer (Shared Component) -->
        <aside class="hidden md:flex h-full w-80 fixed left-0 top-0 flex-col p-lg gap-md glass-nav z-50">
            <div class="flex items-center gap-md mb-xl">
                <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-primary/20">
                    <img alt="Julian Reed" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD7vaV6t-bHz8RAV37ESxRPW3jcZdpI5IPitTBxTW01ofEbaEE6VUUPdri3wj-j85f-eU6ze-qQ8OIXOfHTZkLbU1Fwr5iOJDX-HW593Pov9P38_nLz46YcKoaocdcjogUsfq3EWJoQUzcYSh0qMiT4etS3exma3kTalVa5LKzq04_XPMUi7GxrL9CZapkVDRpEyfvx1y5tde2GJWehvRKrBLqsbKYFLVsfgfdBDED6xsQM7XnBwqccah5W2GyQejGv1xS1BdWcgSM" />
                </div>
                <div>
                    <h2 class="font-h3 text-h3 text-primary">Julian Reed</h2>
                    <p class="font-body-sm text-on-surface-variant">General Manager</p>
                </div>
            </div>
            <nav role="navigation" class="flex flex-col gap-sm">
                <a class="flex items-center gap-md px-md py-sm transition-all duration-300 hover:bg-surface-container-low text-on-surface" href="/pages/hotel/admin-dashboard-lumina/admin-dashboard-lumina.html">
                    <span class="material-symbols-outlined text-primary">dashboard</span>
                    <span class="font-body-md">Dashboard</span>
                </a>
                <a class="flex items-center gap-md px-md py-sm transition-all duration-300 hover:bg-surface-container-low text-on-surface" href="/pages/hotel/amenities-lumina/amenities-lumina.html">
                    <span class="material-symbols-outlined">concierge</span>
                    <span class="font-body-md">Hotel Services</span>
                </a>
                <a class="flex items-center gap-md px-md py-sm transition-all duration-300 hover:bg-surface-container-low text-on-surface" href="/pages/hotel/manage-bookings-lumina/manage-bookings-lumina.html">
                    <span class="material-symbols-outlined">calendar_month</span>
                    <span class="font-body-md">Bookings</span>
                </a>
                <a class="flex items-center gap-md px-md py-sm transition-all duration-300 hover:bg-surface-container-low text-on-surface sidebar-active font-bold" href="/pages/hotel/staff-directory-lumina/staff-directory-lumina.html">
                    <span class="material-symbols-outlined filled text-primary">badge</span>
                    <span class="font-body-md text-primary">Staff Directory</span>
                </a>
                <a class="flex items-center gap-md px-md py-sm transition-all duration-300 hover:bg-surface-container-low text-on-surface" href="/pages/hotel/resource-management-lumina/resource-management-lumina.html">
                    <span class="material-symbols-outlined">meeting_room</span>
                    <span class="font-body-md">Resource Management</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main role="main" class="flex-1 md:ml-80 overflow-y-auto custom-scrollbar relative px-gutter py-xl">
            <!-- TopAppBar -->
            <header role="banner" class="flex justify-between items-center mb-xl">
                <div>
                    <h1 class="font-h1 text-h1 text-primary tracking-tight">Staff Directory</h1>
                    <p class="font-body-md text-on-surface-variant">Manage team members, roles, and shift statuses.</p>
                </div>
                <div class="flex items-center gap-lg">
                    <button class="btn btn-primary flex items-center gap-sm">
                        <span class="material-symbols-outlined text-sm">person_add</span> Add Staff
                    </button>
                    <button class="w-10 h-10 flex items-center justify-center glass-card rounded-full text-on-surface-variant hover:text-primary transition-colors">
                        <span class="material-symbols-outlined">notifications</span>
                    </button>
                </div>
            </header>

            <!-- Toolbar -->
            <section class="mb-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-md">
                <div class="flex items-center gap-sm glass-card rounded-lg px-md py-sm w-full md:w-auto">
                    <span class="material-symbols-outlined text-on-surface-variant">search</span>
                    <input type="text" id="staffSearch" placeholder="Search by name, role, or department..." class="bg-transparent border-none outline-none font-body-md text-on-surface w-full md:w-64 placeholder:text-on-surface-variant/50" />
                </div>
                <div class="flex gap-sm w-full md:w-auto">
                    <select id="departmentFilter" class="glass-card rounded-lg px-md py-sm border-none outline-none font-body-md text-on-surface cursor-pointer w-full md:w-auto">
                        <option value="all">All Departments</option>
                        <option value="Front Desk">Front Desk</option>
                        <option value="Housekeeping">Housekeeping</option>
                        <option value="Food & Beverage">Food & Beverage</option>
                        <option value="Management">Management</option>
                    </select>
                </div>
            </section>

            <!-- Staff Grid -->
            <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-lg" id="staffGrid">
                <!-- Populated by JS -->
            </section>
        </main>
    </div>

    <!-- Global Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-[200] flex flex-col gap-2"></div>

    <script src="/js/ui-utils.js"></script>
    <script src="/pages/hotel/staff-directory-lumina/staff-directory-lumina.js"></script>
